name: Daily Shorts Trigger

on:
  schedule:
    # 15:00 UTC = 17:00 שעון ישראל (5 שעות לפני התזמון ב-22:00)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send GET Webhook to Streamlit
        run: |
          curl -s "https://autofactchannel.streamlit.app/?trigger=upload&secret=${{ secrets.WEBHOOK_SECRET }}"
